<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="64" height="64" role="img" aria-label="Linear Algebra in Python">
  <title>Linear Algebra in Python</title>
  <!-- The course mark: a square lattice and its image under a linear map.
       The faint grid is the domain; the amber ellipse is the image of the unit
       circle, whose semi-axes are the singular values. One picture, the whole
       course. Ink #16213e, amber #c0851a, matching the series identity. -->
  <defs>
    <clipPath id="frame"><rect x="6" y="6" width="108" height="108" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- undeformed lattice, faint -->
    <g stroke="#16213e" stroke-opacity="0.16" stroke-width="1" fill="none">
      <path d="M24 0V120M48 0V120M72 0V120M96 0V120M0 24H120M0 48H120M0 72H120M0 96H120"/>
    </g>
    <!-- sheared lattice: the image of the same grid under [[1, .55],[0, 1]] -->
    <g stroke="#c0851a" stroke-opacity="0.42" stroke-width="1.1" fill="none">
      <path d="M11 0L44 120M35 0L68 120M59 0L92 120M83 0L116 120"/>
      <path d="M0 24H120M0 48H120M0 72H120M0 96H120" stroke-opacity="0.18"/>
    </g>
    <!-- the image of the unit circle: an ellipse, semi-axes = the singular values -->
    <ellipse cx="60" cy="60" rx="42" ry="21" transform="rotate(-28 60 60)"
             fill="none" stroke="#c0851a" stroke-width="4.2"/>
    <!-- the two singular directions -->
    <g stroke="#16213e" stroke-width="4" stroke-linecap="round">
      <path d="M60 60L97 40"/>
      <path d="M60 60L70 42"/>
    </g>
    <circle cx="60" cy="60" r="3.4" fill="#16213e"/>
  </g>
  <rect x="6" y="6" width="108" height="108" rx="10" fill="none" stroke="#16213e" stroke-width="3"/>
</svg>
